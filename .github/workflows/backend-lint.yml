name: backend-lint

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-lint.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-lint.yml"

jobs:
  lint-imports:
    name: lint-imports (module layer contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run lint-imports
        run: uv run lint-imports
