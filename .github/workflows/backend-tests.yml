name: backend-tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  pytest:
    name: pytest (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: manta
          POSTGRES_USER: manta
          POSTGRES_PASSWORD: manta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manta -d manta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MANTA_DATABASE_URL: postgresql+psycopg://manta:manta@localhost:5432/manta

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest -q
