name: dco

on:
  pull_request:

jobs:
  dco:
    name: DCO (Signed-off-by) check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on all PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=$(git log --no-merges --format='%h %s' "$BASE_SHA".."$HEAD_SHA" --invert-grep --grep='Signed-off-by:')
          if [ -n "$missing" ]; then
            echo "::error::以下のコミットに Signed-off-by がありません。'git commit -s' で署名してください (CONTRIBUTING.md 参照):"
            echo "$missing"
            exit 1
          fi
          echo "All commits are signed off."
