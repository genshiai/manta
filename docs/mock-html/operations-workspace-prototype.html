function trendSvg(p){const temp=p.vitals[0].slice(1,4).map(parseFloat),pulse=p.vitals[1].slice(1,4).map(parseFloat);return `<svg viewBox="0 0 570 158" role="img" aria-label="体温と脈拍の推移。青線が体温、黒線が脈拍です。"><title>バイタル推移</title><line class="grid" x1="62" y1="28" x2="550" y2="28"/><line class="grid" x1="62" y1="82" x2="550" y2="82"/><line class="grid" x1="62" y1="136" x2="550" y2="136"/><text class="axis" x="4" y="32">体温 39.0</text><text class="axis" x="4" y="86">体温 37.0</text><text class="axis" x="4" y="140">体温 35.0</text><text class="axis" x="504" y="18">脈拍 100</text><text class="axis" x="510" y="72">脈拍 80</text><text class="axis" x="510" y="126">脈拍 60</text><path class="line-a" d="${chartLine(temp,35,39,136)}"/><path class="line-b" d="${chartLine(pulse,60,100,136)}"/>${temp.map((v,i)=>`<circle class="dot-a" cx="${78+i*164}" cy="${136-(v-35)/4*54}" r="3"/><text class="axis" x="${64+i*164}" y="153">${['08:00','12:00','16:00'][i]}</text>`).join('')}${pulse.map((v,i)=>`<circle class="dot-b" cx="${78+i*164}" cy="${136-(v-60)/40*54}" r="3"/>`).join('')}</svg>`}
function wardPage(selected){const beds=[['301','佐藤 恒一','採血：実施待ち'],['302','田中 太郎','退院サマリ：下書き'],['303','空床',''],['304','鈴木 花子','指示：実施済み'],['305','高橋 健','転棟予定'],['306','清掃中','']];const p=wardPeople[selected];const bedHtml=beds.map(x=>`<button class="bed" ${wardPeople[x[0]]?`data-bed="${x[0]}"`: 'disabled'}><span class="bedno">${x[0]}</span><strong>${x[1]}</strong><span class="note">${x[2]}</span></button>`).join('');const stream=p?`<section class="record-stream"><header>${p.name}　—　本日の経過</header><div class="record"><time>09:10</time><span class="record-icon">✎</span><div><b>看護記録</b><small>息切れなし。離床時のふらつきなし。食事摂取は8割。</small></div><span class="record-kind">自由記述</span></div><div class="record"><time>10:00</time><span class="record-icon">＋</span><div><b>${p.instruction}</b><small>実施状態と結果はオーダーに紐づけて更新する。</small></div><span class="record-kind">オーダー</span></div><div class="record"><time>12:00</time><span class="record-icon">Rx</span><div><b>フロセミド錠 20mg</b><small>1日1回 朝食後。処方は有効期間と変更履歴を持つ。</small></div><span class="record-kind">処方</span></div><div class="record"><time>14:00</time><span class="record-icon">□</span><div><b>退院サマリ</b><small>下書き。署名・発行前の正式文書。</small></div><span class="record-kind">文書</span></div></section><section class="trend"><header>バイタル推移 <span>青：体温　黒：脈拍　値は同じ時点で読む</span></header>${trendSvg(p)}<table class="patient-table"><thead><tr><th>項目</th><th>08:00</th><th>12:00</th><th>16:00</th></tr></thead><tbody>${p.vitals.slice(2).map(r=>`<tr>${r.slice(0,4).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></section><section class="surface-note"><b>表示ルール</b>読み進める情報はこの経過ストリームに置く。全文編集・オーダー入力・署名など「作る／確定する」操作だけを、文脈を残した小さな作業面で開く。</section>`:`<section class="board timeline"><header class="board-head">患者未選択</header><div class="instruction"><div><b>病床を選ぶと、その患者の経過・処方・オーダー・文書を同じ時系列で表示します。</b><small>病棟全体を見ている状態では、特定患者の詳細を勝手に表示しません。</small></div></div></section>`;return `<div class="eyebrow">3A病棟</div><div class="titlebar"><div><h2>病床</h2><p>病棟全体の病床状況から、確認したい患者を選びます。</p></div><button class="plain push">患者を一覧から選ぶ</button></div><div class="ward-grid">${bedHtml}</div>${p?`<section class="board timeline"><header class="board-head">選択患者　—　${p.name}<span>${p.days} · ${p.diagnosis} · 担当 ${p.doctor}</span></header><div class="instruction"><span class="time">本日</span><div><b>経過を読む</b><small>看護・医師の自由記述、処方、オーダー、文書を時間順に確認します。</small></div><span class="action">カルテを開く ›</span></div></section>${stream}`:stream}`}
function metricSvg(label,unit,values,min,max){const xy=values.map((value,index)=>[34+index*92,96-(value-min)/(max-min)*62]);const path=xy.map((p,index)=>`${index?'L':'M'} ${p[0]} ${p[1]}`).join(' ');return `<figure class="mini-trend" data-metric="${label}"><figcaption>${label} <span>${unit}</span></figcaption><svg viewBox="0 0 230 118" role="img" aria-label="${label}の推移"><line class="grid" x1="30" y1="24" x2="220" y2="24"/><line class="grid" x1="30" y1="58" x2="220" y2="58"/><line class="grid" x1="30" y1="96" x2="220" y2="96"/><text x="0" y="28">${max}</text><text x="0" y="100">${min}</text><path class="path" d="${path}"/>${xy.map((p,i)=>`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="3"/><text x="${p[0]-14}" y="114">${['08:00','12:00','16:00'][i]}</text><text x="${p[0]-10}" y="${p[1]-7}">${values[i]}</text>`).join('')}</svg></figure>`}
function trendSvg(p){const rows=p.vitals;const temperature=rows[0].slice(1,4).map(parseFloat),pulse=rows[1].slice(1,4).map(parseFloat),systolic=rows[2].slice(1,4).map(value=>parseInt(value,10)),spo2=rows[3].slice(1,4).map(parseFloat);return `<div class="metric-switches" aria-label="グラフに表示する項目"><button data-metric-toggle="体温" aria-pressed="true">体温</button><button data-metric-toggle="脈拍" aria-pressed="true">脈拍</button><button data-metric-toggle="血圧" aria-pressed="true">血圧（収縮期）</button><button data-metric-toggle="SpO₂" aria-pressed="true">SpO₂</button></div><div class="mini-trends">${metricSvg('体温','℃',temperature,35,39)}${metricSvg('脈拍','/min',pulse,50,110)}${metricSvg('血圧','mmHg',systolic,80,180)}${metricSvg('SpO₂','%',spo2,90,100)}</div>`}
function bindWardBase(){ $$('[data-bed]').forEach(b=>b.onclick=()=>{ $('#page').innerHTML=wardPage(b.dataset.bed); bindWard() });$$('[data-metric-toggle]').forEach(button=>button.onclick=()=>{const active=button.getAttribute('aria-pressed')==='true';button.setAttribute('aria-pressed',String(!active));const chart=$(`.mini-trend[data-metric="${button.dataset.metricToggle}"]`);if(chart)chart.hidden=active});const records=$$('.record');const kinds=['記録','オーダー','検査・処置','処方','文書'];records.forEach((record,index)=>record.dataset.recordKind=kinds[index]);const header=$('.record-stream header');if(header){header.firstChild.nodeValue=header.firstChild.nodeValue.replace('本日の経過','経過タイムライン');header.insertAdjacentHTML('beforeend',`<span class="stream-lenses"><button data-record-filter="すべて" aria-pressed="true">すべて</button>${kinds.map(kind=>`<button data-record-filter="${kind}" aria-pressed="false">${kind}</button>`).join('')}</span>`);$$('[data-record-filter]').forEach(button=>button.onclick=()=>{const filter=button.dataset.recordFilter;$$('[data-record-filter]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));records.forEach(record=>record.hidden=filter!=='すべて'&&record.dataset.recordKind!==filter)})} }
function showRecordDetail(kind,title){const existing=$('#record-detail');if(existing)existing.remove();const copy={
'記録':'記録者・作成時刻・署名状態を含めた自由記述を、前後の経過を残したまま表示します。',
'オーダー':'依頼、実施、結果の状態をこの面で確認します。変更・取消は安全確認を伴う作業面で実行します。',
'検査・処置':'検査・処置は、実施時刻、担当、結果または実施記録までを一つのイベントとして追跡します。',
'処方':'用量、用法、開始・中止、変更履歴を確認します。新規・変更はオーダー作業面から行います。',
'文書':'退院サマリなどの正式文書は、版、署名状態、発行状態を持ちます。'}[kind];$('.record-stream').insertAdjacentHTML('afterend',`<section class="detail-surface" id="record-detail"><header>${kind}　—　${title}</header><p>${copy}</p><div class="detail-actions"><button class="plain">詳細を読む</button>${kind==='文書'?'<button class="primary">文書を開く</button>':kind==='記録'?'<button class="plain">追記する</button>':'<button class="primary">作業面を開く</button>'}</div></section>`)}
function bindWard(){const stream=$('.record-stream');if(stream&&!stream.querySelector('[data-injected-event]')){const anchor=stream.querySelectorAll('.record')[2];anchor.insertAdjacentHTML('beforebegin','<div class="record" data-injected-event><time>11:20</time><span class="record-icon">⌁</span><div><b>胸部X線撮影</b><small>撮影実施。読影レポートは到着後にこの行へ紐づきます。</small></div><span class="record-kind">検査・処置</span></div>')}bindWardBase();$$('.record').forEach(record=>{const title=record.querySelector('b')?.textContent||'';record.insertAdjacentHTML('beforeend','<button class="record-open">詳細 ›</button>');record.querySelector('.record-open').onclick=()=>showRecordDetail(record.dataset.recordKind,title)})}
function render(key){const v=layouts[key];$('#context-title').textContent=v.context;$('#crumb').textContent=v.crumb;$('#context-list').innerHTML=v.rows;$('#page').innerHTML=key==='ward'?wardPage():v.html;$$('.nav[data-screen]').forEach(b=>b.classList.toggle('on',b.dataset.screen===key));if(key==='ward')bindWard()}
$$('.nav[data-screen]').forEach(b=>b.onclick=()=>render(b.dataset.screen));render('outpatient');
</script></body></html>
