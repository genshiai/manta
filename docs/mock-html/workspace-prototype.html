<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manta — ワークスペース型 UI モック（意思決定用）</title>
<!--
  ワークスペース型シェルの意思決定用モック（2026-07-14 / 第2版: タイムライン拡充）
  検証すること:
    1. 業務バーを切り替えても、自分の作業キューへ迷わず戻れるか
    2. 患者を切り替えてから「本日の記載」を始めるまでが短いか
    3. 補助ペインを閉じても、安全情報が患者ヘッダーに残るか
    4. 外来・病棟・医事・設定・連絡が同じシェルで成立するか
    5. 5年分のタイムライン（診察・検査・画像・文書・ワクチン・健診・入院・キャンセル）が読みやすいか
    6. 検査は「表」を基本ビューにできるか（レンズ=検査）
    7. オーダーの発行→実施→結果到着が非同期に追えるか（20秒後に高橋の採血結果が届くデモ）
  右下のスイッチ: 配色（ミューテッド/現行Apple）・書体（ゴシック/等幅）・職種（医師/看護/医事 → レール剪定）
  データはすべて架空。実在の人物・医療機関とは関係ない。
-->
<style>
/* ============ font ============ */
@font-face {
  font-family: "Guguru Sans Code 35";
  src: url("../../frontend/public/fonts/GuguruSansCode35-Regular.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Guguru Sans Code 35";
  src: url("../../frontend/public/fonts/GuguruSansCode35-Bold.woff2") format("woff2");
  font-weight: 700; font-style: normal; font-display: swap;
}

/* ============ palette ============ */
body.pal-muted {
  --canvas:#f6f5f2; --card:#fffefb; --ink:#26241f; --ink2:#56524a; --muted:#8b8579;
  --line:#e7e3da; --line-strong:#d3cec2; --hair:#efece5;
  --accent:#2e6da8; --accent-deep:#275e91; --accent-tint:#edf3f9; --accent-line:#c9dbeb;
  --safe:#a8453d; --safe-bg:#faf0ee; --safe-line:#ecd6d1;
  --lab-high:#b0403a; --lab-low:#2b5f96; --ok:#4c7a5a;
  --sel:#f0eee8; --kbg:#efede6;
  --sh-pop:0 10px 34px rgba(38,36,31,.13);
}
body.pal-apple {
  --canvas:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --ink2:#48484c; --muted:#6e6e73;
  --line:#e5e5ea; --line-strong:#d2d2d7; --hair:#ededf0;
  --accent:#0071e3; --accent-deep:#0066cc; --accent-tint:#e8f1fc; --accent-line:#c4dcf5;
  --safe:#d70015; --safe-bg:#ffecea; --safe-line:#f5cfcb;
  --lab-high:#d70015; --lab-low:#0a5dc2; --ok:#34833f;
  --sel:#f0f0f3; --kbg:#f0f0f2;
  --sh-pop:0 10px 34px rgba(0,0,0,.14);
}

/* ============ type ============ */
body.font-sans {
  --f-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --f-num:"Guguru Sans Code 35","SF Mono",ui-monospace,Menlo,monospace;
}
body.font-mono {
  --f-body:"PlemolJP","Guguru Sans Code 35",ui-monospace,Menlo,monospace;
  --f-num:"PlemolJP","Guguru Sans Code 35",ui-monospace,Menlo,monospace;
}

/* オーダー種別の意味色（P0-2 一元対応表の系譜 — 小チップ・ドット専用、行や本文は塗らない） */
body {
  --dm-med:#2f7268;  --dm-med-bg:#e4f1ee;
  --dm-test:#67589e; --dm-test-bg:#eeebf6;
  --dm-img:#38788f;  --dm-img-bg:#e7f1f5;
  --dm-proc:#a2612d; --dm-proc-bg:#f7ede2;
  --dm-reha:#5e7a45; --dm-reha-bg:#edf2e6;
}

* { box-sizing:border-box; }
html,body { height:100%; }
body {
  margin:0; background:var(--canvas); color:var(--ink);
  font-family:var(--f-body); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; border-radius:6px; }
.num { font-family:var(--f-num); font-variant-numeric:tabular-nums; letter-spacing:0; }

/* ============ app grid ============ */
#app { display:grid; grid-template-columns:56px 288px minmax(560px,1fr) 308px; grid-template-rows:100vh; height:100vh; }
#app > * { min-height:0; min-width:0; }
#app.aid-closed { grid-template-columns:56px 288px minmax(560px,1fr); }
#app.aid-closed #aid { display:none; }

/* ============ rail ============ */
#rail { background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:12px 0 14px; gap:6px; }
.mark { width:32px; height:32px; display:grid; place-items:center; margin-bottom:12px; user-select:none; }
.mark img { width:27px; height:auto; display:block; }
.rail-btn { width:46px; padding:7px 0 6px; border-radius:9px; display:grid; justify-items:center; gap:2px; color:var(--muted); position:relative; }
.rail-btn svg { width:18px; height:18px; stroke:currentColor; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.rail-btn span { font-size:10px; font-weight:600; letter-spacing:.02em; }
.rail-btn:hover { background:var(--sel); color:var(--ink2); }
.rail-btn.active { background:var(--accent-tint); color:var(--accent); }
.rail-badge { position:absolute; top:2px; right:4px; min-width:15px; height:15px; border-radius:8px; background:var(--accent); color:#fff; font-size:9.5px; font-weight:700; display:grid; place-items:center; padding:0 4px; }
.rail-bottom { margin-top:auto; display:grid; gap:6px; justify-items:center; }
.rail-avatar { width:28px; height:28px; border-radius:50%; background:var(--kbg); color:var(--ink2); font-size:12px; font-weight:700; display:grid; place-items:center; }

/* ============ context pane ============ */
#context { background:var(--card); border-right:1px solid var(--line); min-width:0; display:flex; flex-direction:column; }
.ctx-head { padding:16px 16px 12px; border-bottom:1px solid var(--line); }
.eyebrow { font-size:11px; color:var(--muted); letter-spacing:.03em; }
.ctx-title { font-size:16.5px; font-weight:700; letter-spacing:-.01em; margin:2px 0 10px; }
.ctx-search { height:32px; border:1px solid var(--line-strong); background:var(--canvas); border-radius:8px; display:flex; align-items:center; gap:7px; color:var(--muted); padding:0 10px; font-size:12px; width:100%; }
.ctx-search .kbd { margin-left:auto; }
.ctx-body { overflow-y:auto; padding:6px 8px 18px; flex:1; }
.ctx-section { padding:12px 0 2px; }
.ctx-label { padding:0 10px 6px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.05em; }
.prow { width:100%; text-align:left; border-radius:8px; padding:8px 10px; display:grid; grid-template-columns:30px 1fr auto; gap:10px; align-items:start; position:relative; }
.prow:hover { background:var(--canvas); }
.prow.active { background:var(--accent-tint); }
.prow.active::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:2.5px; border-radius:2px; background:var(--accent); }
.pavatar { width:30px; height:30px; border-radius:50%; background:var(--kbg); color:var(--ink2); font-size:12px; font-weight:700; display:grid; place-items:center; margin-top:1px; }
.prow.active .pavatar { background:var(--card); color:var(--accent); }
.pname { display:block; font-size:13.5px; font-weight:650; line-height:1.4; }
.pmeta { display:block; font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:1px; }
.pstate { display:block; font-size:11.5px; line-height:1.5; margin-top:1px; color:var(--ink2); }
.pstate.safety { color:var(--safe); font-weight:600; }
.pstate.att { color:var(--ink); font-weight:600; }
.pstate.att .sdot { background:var(--ink); }
.pstate.accent { color:var(--accent); font-weight:600; }
.pstate.accent .sdot { background:var(--accent); }
.pstate.done { color:var(--muted); }
.pstate .sdot { display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--ink2); vertical-align:2px; margin-right:5px; }
.pstate.quiet .sdot { display:none; }
.ptime { font-size:11px; color:var(--muted); margin-top:2px; }
.prow.done .pname { color:var(--ink2); font-weight:500; }
.ctx-foot { border-top:1px solid var(--line); padding:10px 16px; font-size:11.5px; color:var(--muted); }

.brow { width:100%; text-align:left; border-radius:8px; padding:9px 10px; display:grid; gap:2px; }
.brow:hover { background:var(--canvas); }
.brow.active { background:var(--accent-tint); }
.brow .l1 { display:flex; gap:8px; align-items:baseline; font-size:13px; font-weight:650; }
.brow .l1 .room { font-size:11.5px; color:var(--muted); font-weight:600; }
.brow .l1 .when { margin-left:auto; font-size:10.5px; color:var(--muted); font-weight:400; }
.brow .l2 { font-size:11.5px; color:var(--muted); }
.brow .l2 b { color:var(--ink2); font-weight:600; }
.brow .l2 .att { color:var(--safe); font-weight:600; }
.brow .unread { display:inline-block; min-width:15px; height:15px; border-radius:8px; background:var(--accent); color:#fff; font-size:9.5px; font-weight:700; text-align:center; line-height:15px; padding:0 4px; margin-left:6px; vertical-align:1px; }

/* ============ main ============ */
#main { min-width:0; display:flex; flex-direction:column; background:var(--canvas); }
#topbar { height:52px; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 18px 0 20px; flex:none; }
.crumbs { font-size:12px; color:var(--muted); white-space:nowrap; display:flex; gap:7px; align-items:center; min-width:0; }
.crumbs .sep { color:var(--line-strong); }
.crumbs .here { color:var(--ink); font-weight:600; }
.crumbs button:hover { color:var(--ink2); text-decoration:underline; }
.top-search { flex:1; max-width:400px; margin:0 auto; height:32px; background:var(--canvas); border:1px solid var(--line); border-radius:8px; display:flex; align-items:center; gap:7px; padding:0 10px; color:var(--muted); font-size:12px; }
.top-search .kbd { margin-left:auto; }
.top-actions { display:flex; gap:8px; align-items:center; margin-left:auto; }

#patientbar { min-height:54px; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:8px 20px; flex:none; flex-wrap:wrap; }
.pb-name { font-size:16px; font-weight:700; letter-spacing:.01em; }
.pb-kana { font-size:10.5px; color:var(--muted); }
.pb-meta { font-size:12px; color:var(--ink2); }
.pb-meta .num { color:var(--muted); }
.safety-label { font-size:11.5px; font-weight:650; color:var(--safe); background:var(--safe-bg); border:1px solid var(--safe-line); border-radius:5px; padding:1.5px 7px; }
.pb-problems { font-size:12px; color:var(--muted); }
.pb-right { margin-left:auto; display:flex; gap:8px; align-items:center; }
.pb-save { font-size:11.5px; color:var(--muted); margin-right:2px; }

#aistrip { min-height:32px; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; padding:5px 20px; flex:none; font-size:12.5px; }
.ai-mark { color:var(--accent); font-size:12px; flex:none; }
.ai-line { color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.ai-link { color:var(--accent); font-size:12px; font-weight:600; white-space:nowrap; }
.ai-link:hover { text-decoration:underline; }
.ai-meta { margin-left:auto; color:var(--muted); font-size:11px; white-space:nowrap; }

#lensbar { min-height:40px; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:4px; padding:0 20px; flex:none; flex-wrap:wrap; position:relative; }
.lens { font-size:12.5px; font-weight:600; color:var(--ink2); border-radius:99px; padding:4.5px 12px; }
.lens:hover { background:var(--canvas); }
.lens.active { background:var(--ink); color:var(--card); }
.lens-right { margin-left:auto; display:flex; gap:6px; }
.chip { font-size:11.5px; font-weight:600; color:var(--ink2); border:1px solid var(--line-strong); background:var(--card); border-radius:7px; padding:4px 9px; display:flex; gap:6px; align-items:center; }
.chip:hover { background:var(--canvas); }

#content { flex:1; overflow-y:auto; min-height:0; }
.sheet-wrap { padding:20px 28px 60px; position:relative; }
.sheet { max-width:860px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.month-float { position:sticky; top:0; z-index:5; width:max-content; margin:0 0 -30px auto; background:var(--card); border:1px solid var(--line-strong); border-radius:99px; padding:3px 12px; font-size:11.5px; font-weight:650; color:var(--ink2); box-shadow:0 2px 10px rgba(0,0,0,.05); }

/* calendar popover */
#calpop { position:absolute; right:20px; top:44px; z-index:30; width:330px; background:var(--card); border:1px solid var(--line-strong); border-radius:11px; box-shadow:var(--sh-pop); padding:12px 14px; }
#calpop .cp-head { display:flex; align-items:center; font-size:12px; font-weight:700; margin-bottom:8px; }
#calpop .cp-head .x { margin-left:auto; color:var(--muted); padding:2px 6px; border-radius:6px; }
#calpop .cp-head .x:hover { background:var(--canvas); }
.cp-year { display:grid; grid-template-columns:44px 1fr; gap:8px; align-items:baseline; padding:5px 0; border-top:1px solid var(--hair); }
.cp-year:first-of-type { border-top:0; }
.cp-y { font-size:12px; font-weight:700; color:var(--ink2); }
.cp-months { display:flex; flex-wrap:wrap; gap:4px; }
.cp-m { font-size:11px; font-weight:600; color:var(--accent); background:var(--accent-tint); border-radius:6px; padding:2px 8px; }
.cp-m:hover { background:var(--accent-line); }
.cp-m.fold { color:var(--ink2); background:var(--sel); }
#calpop .cp-note { font-size:10.5px; color:var(--muted); margin-top:8px; }

/* ai card */
.ai-card { margin:16px 18px 4px; border:1px solid var(--accent-line); border-radius:11px; background:linear-gradient(180deg,var(--accent-tint),var(--card) 72%); padding:14px 18px 12px; }
.ai-card-head { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; }
.ai-card-head .meta { font-weight:400; color:var(--muted); font-size:11px; }
.ai-card-head .fold { margin-left:auto; font-size:11.5px; color:var(--muted); }
.ai-card-head .fold:hover { color:var(--ink2); }
.ai-card-grid { display:grid; grid-template-columns:1fr 224px; gap:18px; margin-top:8px; }
.ai-card-body p { margin:0 0 8px; font-size:13px; line-height:1.8; }
.ai-card-body b { font-weight:650; }
.ai-ev-label { font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:.05em; margin-bottom:6px; }
.ai-ev { display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 10px; margin-bottom:6px; }
.ai-ev:hover { border-color:var(--line-strong); background:var(--canvas); }
.ai-ev .d { display:block; font-size:11px; color:var(--muted); }
.ai-ev .t { font-size:12px; font-weight:600; line-height:1.5; }
.ai-card-foot { display:flex; align-items:center; gap:10px; border-top:1px solid var(--hair); margin-top:6px; padding-top:9px; font-size:11px; color:var(--muted); }
.ai-card-foot .ask { margin-left:auto; color:var(--accent); font-weight:600; font-size:12px; white-space:nowrap; }

/* day blocks */
.dayblock { border-top:1px solid var(--line); }
.dayblock:first-child { border-top:0; }
.dayblock.today { border-left:3px solid var(--accent); }
.day-h { display:flex; align-items:baseline; gap:9px; padding:12px 20px 0; font-size:12px; color:var(--muted); flex-wrap:wrap; }
.day-h .date { font-size:13.5px; font-weight:700; color:var(--ink); }
.day-h .today-tag { font-size:10.5px; font-weight:700; color:var(--accent); background:var(--accent-tint); border-radius:5px; padding:1px 7px; }
.day-h .dots { margin-left:auto; color:var(--muted); }
.day-grid { display:grid; grid-template-columns:1fr 232px; gap:0 18px; padding:10px 20px 14px; }
.day-main { min-width:0; display:grid; gap:9px; align-content:start; }
.krow { display:grid; grid-template-columns:20px 1fr; gap:11px; }
.kkey { width:20px; height:20px; border-radius:6px; background:var(--kbg); color:var(--ink2); font-size:10.5px; font-weight:700; display:grid; place-items:center; margin-top:3px; }
.ktext { font-size:14px; line-height:1.75; min-width:0; }
.kplaceholder { color:var(--muted); }
.datachip { display:inline-block; font-size:12px; font-weight:650; background:var(--sel); border:1px solid var(--line); border-radius:6px; padding:0 7px; line-height:1.7; white-space:nowrap; }
.datachip .src { font-weight:400; font-size:10px; color:var(--muted); margin-left:4px; }
.day-acts { border-left:1px solid var(--line); padding-left:16px; display:grid; gap:7px; align-content:start; }
.acts-label { font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:.05em; display:flex; align-items:center; }
.acts-label .add { margin-left:auto; color:var(--muted); font-size:13px; padding:0 3px; border-radius:5px; }
.acts-label .add:hover { background:var(--canvas); color:var(--ink2); }
.act .a1 { font-size:12px; font-weight:650; line-height:1.5; }
.act .a2 { font-size:11px; color:var(--muted); line-height:1.5; }
.act .a2.done { color:var(--ok); }
.act .a2.wait { color:var(--ink2); font-weight:600; }
.points { border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px; font-size:11px; color:var(--muted); }
.points .total-line { display:flex; justify-content:flex-end; align-items:baseline; gap:6px; width:100%; text-align:right; font-size:12px; font-weight:700; color:var(--ink2); }
.points .total-line:hover { color:var(--ink); }
.points .detail { margin-top:5px; line-height:1.7; display:none; }
.points.open .detail { display:block; }
.addline { border-top:1px dashed var(--line); margin:0 20px; padding:9px 0 11px; font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; }
.addline .slash { width:20px; height:20px; border:1px dashed var(--line-strong); border-radius:6px; display:grid; place-items:center; font-size:11px; }
.compose { margin:0 20px 16px; border:1px dashed var(--line-strong); border-radius:10px; padding:13px 16px; display:flex; align-items:center; gap:12px; background:var(--card); }
.compose .c1 { font-size:13.5px; font-weight:650; }
.compose .c2 { font-size:12px; color:var(--muted); margin-top:1px; }
.compose .btn { margin-left:auto; }

/* lab block */
.labgrid { display:grid; gap:6px; padding:10px 20px 14px; }
.labrow { display:grid; grid-template-columns:minmax(120px,1fr) auto; gap:12px; align-items:baseline; border:1px solid var(--hair); border-radius:8px; padding:7px 12px; background:var(--card); }
.labrow .ln { font-size:12.5px; color:var(--ink2); }
.labrow .lv { font-size:13px; font-weight:700; }
.labrow .lv .u { font-size:11px; color:var(--muted); font-weight:400; margin-left:3px; }
.labrow .lv .ref { font-size:10.5px; color:var(--muted); font-weight:400; margin-left:8px; }
.lv.high { color:var(--lab-high); }
.lv.low { color:var(--lab-low); }
.labcat { font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:.05em; padding:8px 2px 2px; }
.labmini { display:grid; grid-template-columns:1fr 1fr; gap:2px 20px; }
.labmini-row { display:grid; grid-template-columns:minmax(60px,auto) 1fr auto; gap:8px; align-items:baseline; font-size:12px; padding:2.5px 0; border-bottom:1px solid var(--hair); }
.labmini-row .mn { color:var(--ink2); }
.labmini-row .mv { font-weight:650; text-align:right; }
.labmini-row .mv i { font-style:normal; font-size:10px; color:var(--muted); font-weight:400; }
.labmini-row .mr { font-size:10px; color:var(--muted); text-align:right; min-width:58px; }
@media (max-width:1240px){ .labmini { grid-template-columns:1fr; } }

/* compact event rows on stream */
.evrow { display:flex; gap:10px; align-items:baseline; padding:10px 20px 12px; }
.evrow .ev-kind { flex:none; font-size:10.5px; font-weight:700; color:var(--ink2); background:var(--sel); border-radius:5px; padding:1.5px 7px; }
.evrow .ev-text { font-size:13px; color:var(--ink2); min-width:0; }
.evrow .ev-text b { color:var(--ink); font-weight:650; }
.evrow .ev-link { margin-left:auto; flex:none; font-size:11.5px; color:var(--accent); font-weight:600; }

/* image block */

/* admission period block */

/* year fold */
.yearfold { width:100%; text-align:left; display:flex; gap:10px; align-items:baseline; padding:11px 20px; font-size:12.5px; color:var(--ink2); border-top:1px solid var(--line); background:var(--card); }
.yearfold:hover { background:var(--canvas); }
.yearfold .y { font-size:13px; font-weight:700; color:var(--ink); }
.yearfold .cnt { color:var(--muted); }
.yearfold .arr { margin-left:auto; color:var(--muted); font-size:11px; }

/* --- timeline gutter --- */
.dayblock { display:grid; grid-template-columns:112px minmax(0,1fr); }
.gut { position:relative; padding:14px 8px 12px 16px; }
.gut::before { content:""; position:absolute; top:0; bottom:0; right:13px; width:1px; background:var(--hair); }
.gut::after { content:""; position:absolute; top:20px; right:9.5px; width:8px; height:8px; border-radius:50%; background:var(--card); border:1.5px solid var(--line-strong); }
.dayblock.today .gut::after { background:var(--accent); border-color:var(--accent); }
.dayblock.t-adm .gut::after { background:var(--ink2); border-color:var(--ink2); }
.dayblock.in-adm .gut::before { width:3px; right:12px; background:color-mix(in srgb, var(--ink2) 22%, var(--hair)); }
.dayblock.in-adm .gut::after { border-color:var(--ink2); }
.gd { display:block; font-size:13.5px; font-weight:700; letter-spacing:.01em; line-height:1.4; }
.gy { display:block; font-size:10.5px; color:var(--muted); margin-top:1px; line-height:1.4; }
.gk { display:inline-block; font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.06em; margin-top:5px; }
.dayblock.today .gk { color:var(--accent); }
.bd { min-width:0; padding-right:4px; }
.bd .day-h, .bd .labgrid, .bd .past-sum, .bd .evrow, .bd .imgblock, .bd .adm-body { padding-left:0; }
.bd .day-grid { padding-left:0; }
.bd .addline, .bd .compose { margin-left:0; }
.taskrow { display:flex; gap:10px; align-items:center; font-size:13px; padding:6px 0; border-top:1px solid var(--hair); }
.taskrow:first-child { border-top:0; }
.taskrow .tdone { color:var(--ok); font-size:12px; font-weight:600; }
.taskrow .act-btn { margin-left:auto; }

/* past block */
.past-sum { padding:2px 20px 12px; }
.fold-btn { font-size:11.5px; color:var(--muted); padding:2px 0; }
.fold-btn:hover { color:var(--ink2); }
.stream-end { text-align:center; font-size:11.5px; color:var(--muted); padding:18px 0 4px; }

/* lens views: matrix / rx / orders */
.lensview { padding:16px 20px 20px; }
.lensview .lv-head { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
.lensview .lv-title { font-size:14px; font-weight:700; }
.lensview .lv-sub { font-size:11.5px; color:var(--muted); }
.lensview .lv-nav { margin-left:auto; display:flex; gap:6px; }
.matrix-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
table.matrix { border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px; }
.matrix th, .matrix td { padding:8px 12px; border-bottom:1px solid var(--hair); white-space:nowrap; text-align:right; }
.matrix thead th { font-size:11px; color:var(--muted); font-weight:600; background:var(--canvas); position:sticky; top:0; }
.matrix thead th .yy { display:block; font-size:9.5px; font-weight:400; }
.matrix tbody th { text-align:left; font-weight:600; color:var(--ink2); background:var(--card); position:sticky; left:0; border-right:1px solid var(--hair); }
.matrix td { font-family:var(--f-num); font-variant-numeric:tabular-nums; font-weight:600; }
.matrix td.high { color:var(--lab-high); }
.matrix td.low { color:var(--lab-low); }
.matrix td.na { color:var(--line-strong); font-weight:400; }
.matrix tbody tr:last-child td, .matrix tbody tr:last-child th { border-bottom:0; }
.matrix tr.gr th { position:static; background:var(--canvas); font-size:10.5px; color:var(--muted); letter-spacing:.05em; padding:6px 12px; }
.matrix .refcol { font-size:10.5px; color:var(--muted); font-weight:400; white-space:nowrap; text-align:right; }
.matrix tbody th .uu { font-size:10px; color:var(--muted); font-weight:400; }
.matrix .ctag { display:block; font-size:8.5px; font-weight:700; color:var(--ink2); letter-spacing:.04em; }
.matrix .sparkcell { padding:4px 10px; }
.matrix thead th.sparkhead { text-align:center; }
.matrix tbody tr[data-trend] { cursor:pointer; }
.matrix tbody tr[data-trend]:hover td, .matrix tbody tr[data-trend]:hover th { background:var(--canvas); }
.matrix tbody tr.trend-on th, .matrix tbody tr.trend-on td { background:var(--accent-tint); }
.matrix tr.trendrow td { background:var(--canvas); padding:10px 14px; cursor:default; }
.trend-wrap { max-width:780px; }
.trend-head { display:flex; gap:8px; align-items:baseline; font-size:12px; margin-bottom:4px; }
.trend-head b { font-size:12.5px; }
.trend-head span { color:var(--muted); font-size:11px; }
.trend-head .trend-ref { color:var(--ink2); }
.tscope-row { display:inline-flex; gap:2px; margin-left:10px; background:var(--sel); border-radius:7px; padding:2px; }
.tscope { font-size:10.5px; font-weight:600; color:var(--ink2); border-radius:5px; padding:2px 8px; }
.tscope.active { background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06); }

/* 温度板 固定バンド（入院中の患者のみ — 患者に固定、タイムライン外） */
#vitalsbar { background:var(--card); border-bottom:1px solid var(--line); padding:7px 20px 8px; flex:none; }
.vb-head { display:flex; align-items:baseline; gap:10px; font-size:12px; }

.vb-meta { color:var(--muted); font-size:11px; }
.vb-now { margin-left:auto; color:var(--ink2); font-weight:600; font-size:12px; }
.vb-chart { max-width:860px; margin:6px auto 0; }
.vb-legend { display:flex; gap:14px; font-size:10.5px; color:var(--muted); padding-top:3px; }

/* ⌘O オーダーコンポーザ（右ドロワー — カルテを隠さない） */
#composer { position:fixed; top:0; right:0; bottom:0; width:440px; background:var(--card); border-left:1px solid var(--line-strong); box-shadow:var(--sh-pop); z-index:45; display:flex; flex-direction:column; }
.comp-head { display:flex; align-items:center; gap:9px; padding:12px 14px; border-bottom:1px solid var(--line); }

.comp-form { margin:10px 14px 0; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:12px; color:var(--muted); }
.comp-form .cf-name { font-size:14px; font-weight:700; color:var(--ink); }
.comp-form .cf-sub { font-size:12px; color:var(--ink2); margin-top:2px; }

.cf-dose { font-size:13px; font-weight:700; color:var(--ink); margin:8px 0 6px; }

.cf-warnrow { color:#8a5c14; background:#faf3e3; border:1px solid #eadfc0; }
.cf-okrow { color:var(--ok); background:var(--ok-tint, #eef4ef); border:1px solid var(--hair); }
.cf-inforow { color:var(--muted); background:var(--canvas); border:1px solid var(--hair); }
.rxf { padding:14px 16px 8px; }
.rxf-name { font-size:15px; font-weight:700; line-height:1.5; }
.rxf-sub { font-size:11.5px; color:var(--muted); margin:2px 0 10px; }
.rx-preview { border:1.5px solid var(--line-strong); background:var(--canvas); border-radius:10px; padding:11px 14px; font-size:14px; font-weight:700; margin:6px 0 12px; line-height:1.6; }
.rx-preview .tot { font-weight:600; color:var(--accent); font-size:11.5px; margin-left:10px; }
.rx-row { display:grid; grid-template-columns:44px 1fr; gap:8px; align-items:baseline; margin:8px 0; }
.rx-lab { font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:.04em; }
.rx-actions { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--card); flex-wrap:wrap; }
#composer.wide { width:920px; }
.comp-cols { display:grid; grid-template-columns:300px 1fr; height:100%; min-height:0; }
.comp-side { border-right:1px solid var(--line); background:var(--canvas); overflow-y:auto; }
.comp-side .comp-row { background:var(--card); border:1px solid var(--line); border-radius:9px; margin:0 12px 6px; padding:8px 12px; }

.comp-maincol { display:flex; flex-direction:column; min-width:0; min-height:0; }

.cart-row { display:flex; gap:8px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:9px; margin:0 12px 6px; padding:8px 10px 8px 12px; }
.cart-row .cart-main { min-width:0; font-size:12px; line-height:1.55; }
.cart-row .cart-main b { display:block; font-size:12.5px; }
.cart-row .cart-main span { color:var(--muted); font-size:11px; }
.cart-row .aid-close { font-size:12px; margin-left:auto; }
.comp-side .comp-row.myset { display:flex; align-items:flex-start; gap:4px; padding:0; }
.comp-side .myset-apply { flex:1; text-align:left; display:grid; grid-template-columns:40px 1fr; gap:4px 10px; padding:8px 0 8px 12px; align-items:baseline; }
.comp-side .myset-apply .cr-sub { grid-column:2; }

.setsave-row { display:flex; gap:6px; }
.setsave-row input { flex:1; border:1px solid var(--line-strong); background:var(--card); border-radius:8px; padding:6px 9px; font:inherit; font-size:12px; min-width:0; }
.setsave-row input:focus { outline:2px solid var(--accent); outline-offset:0; }
#report { position:fixed; top:0; right:0; bottom:0; width:480px; background:var(--card); border-left:1px solid var(--line-strong); box-shadow:var(--sh-pop); z-index:46; display:flex; flex-direction:column; }
.rep-chain { margin:12px 0 4px; }
.rep-step { position:relative; display:grid; grid-template-columns:96px 1fr; gap:10px; padding:0 0 14px 14px; font-size:12px; }
.rep-step::before { content:""; position:absolute; left:0; top:5px; bottom:-2px; width:1px; background:var(--hair); }
.rep-step::after { content:""; position:absolute; left:-3px; top:4px; width:7px; height:7px; border-radius:50%; background:var(--card); border:1.5px solid var(--line-strong); }
.rep-step.last::before { display:none; }
.rep-step.last::after { background:var(--ok); border-color:var(--ok); }
.rep-step .rep-t { color:var(--muted); font-size:11px; }
.rep-step .rep-x { color:var(--ink2); line-height:1.6; }

.tlrow.has-rep { cursor:pointer; }
.tlrow.has-rep:hover { background:var(--canvas); }
.comp-foot { border-top:1px solid var(--line); padding:9px 14px; font-size:11px; color:var(--muted); display:flex; gap:12px; }
.lv-note { font-size:11.5px; color:var(--muted); margin-top:10px; }

.tl { border:1px solid var(--line); border-radius:10px; overflow:hidden; }

.tlrow .st.cont { color:var(--accent); font-weight:650; }
.tlrow .st.stop { color:var(--muted); }
.tlrow .ocat-chip { display:inline-block; font-size:9.5px; font-weight:700; color:var(--ink2); background:var(--sel); border-radius:4px; padding:1px 6px; margin-right:7px; vertical-align:1.5px; }
.dm-med  { color:var(--dm-med)  !important; background:var(--dm-med-bg)  !important; }
.dm-test { color:var(--dm-test) !important; background:var(--dm-test-bg) !important; }
.dm-img  { color:var(--dm-img)  !important; background:var(--dm-img-bg)  !important; }
.dm-proc { color:var(--dm-proc) !important; background:var(--dm-proc-bg) !important; }
.dm-reha { color:var(--dm-reha) !important; background:var(--dm-reha-bg) !important; }
.secdot { display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:7px; vertical-align:1px; background:var(--line-strong); }
.secdot.dm-med{background:var(--dm-med)} .secdot.dm-test{background:var(--dm-test)}
.secdot.dm-img{background:var(--dm-img)} .secdot.dm-proc{background:var(--dm-proc)} .secdot.dm-reha{background:var(--dm-reha)}
.ocat-row { display:flex; gap:4px; flex-wrap:wrap; margin:2px 0 12px; }
.ocat { font-size:11.5px; font-weight:600; color:var(--ink2); border-radius:99px; padding:3.5px 11px; }
.ocat:hover { background:var(--canvas); }
.ocat.active { background:var(--ink); color:var(--card); }
.tl-sec { font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:.05em; padding:14px 2px 6px; }

.tlrow .tag { display:inline-block; font-size:10px; font-weight:700; border:1px solid var(--line-strong); border-radius:5px; padding:0 5px; margin-left:7px; color:var(--ink2); vertical-align:1px; }
.tlrow.ghost { color:var(--muted); }
.tlrow.ghost .w { font-weight:400; font-size:12px; color:var(--muted); }

/* home & workspace views */
.view { max-width:920px; margin:0 auto; padding:26px 32px 60px; }

.vsection { margin-bottom:26px; }
.vlabel { font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--muted); margin-bottom:8px; }
.vcard { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.arow { display:flex; align-items:center; gap:14px; padding:11px 16px; border-top:1px solid var(--hair); }

.trow:first-child { border-top:0; }
.trow:hover { background:var(--canvas); }

.bill-lines { padding:4px 0; }

.msg-sys .okmark { color:var(--ok); font-weight:700; }
.msg-actions { display:flex; gap:8px; padding:4px 16px 4px 56px; }
.composer { margin:12px 16px 16px; border:1px solid var(--line-strong); border-radius:10px; background:var(--card); padding:10px 12px; font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px; }
.composer .kbd { margin-left:auto; }
.msg-note { font-size:11px; color:var(--muted); text-align:center; padding-bottom:14px; }

/* aid pane */
#aid { background:var(--card); border-left:1px solid var(--line); overflow-y:auto; min-width:0; }
.aid-head { display:flex; align-items:center; padding:14px 16px 10px; }
.aid-head h2 { font-size:13px; font-weight:700; margin:0; }
.aid-close { margin-left:auto; color:var(--muted); font-size:15px; padding:2px 6px; border-radius:6px; }
.aid-close:hover { background:var(--canvas); color:var(--ink2); }
.aid-sec { margin:0 12px 12px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.aid-sec-title { padding:9px 12px; font-size:11.5px; font-weight:700; border-bottom:1px solid var(--hair); display:flex; align-items:baseline; }
.aid-sec-title .m { margin-left:auto; font-weight:400; font-size:10.5px; color:var(--muted); }
.aid-row { padding:8px 12px; border-bottom:1px solid var(--hair); }
.aid-row:last-child { border-bottom:0; }
.aid-row .r1 { font-size:12px; font-weight:600; line-height:1.5; display:flex; gap:8px; align-items:baseline; }
.aid-row .r1 .v { margin-left:auto; font-weight:700; }
.aid-row .r1 .v.high { color:var(--lab-high); }
.aid-row .r1 .v.low { color:var(--lab-low); }
.aid-row .r1 .v .u { font-size:10.5px; color:var(--muted); font-weight:400; }
.aid-row .r2 { font-size:11px; color:var(--muted); line-height:1.5; }
.aid-row .r1 .safe-ink { color:var(--safe); }
.aid-empty { padding:10px 12px; font-size:11.5px; color:var(--muted); }

/* buttons */
.btn { font-size:12.5px; font-weight:650; color:var(--ink2); background:var(--card); border:1px solid var(--line-strong); border-radius:8px; padding:6.5px 12px; display:inline-flex; gap:7px; align-items:center; white-space:nowrap; }
.btn:hover { background:var(--canvas); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover { background:var(--accent-deep); }
.btn.sm { font-size:11.5px; padding:4.5px 10px; border-radius:7px; }
.btn[disabled] { opacity:.45; cursor:default; }
.btn[disabled]:hover { background:var(--card); }
.kbd { font-family:var(--f-num); font-size:10px; color:var(--muted); border:1px solid var(--line-strong); border-radius:4px; padding:0 4px; line-height:1.5; background:var(--card); }
.btn.primary .kbd { color:rgba(255,255,255,.85); border-color:rgba(255,255,255,.4); background:transparent; }
.ghost-ai { font-size:12px; font-weight:650; color:var(--ink2); border:1px solid var(--line-strong); border-radius:8px; padding:5.5px 10px; display:inline-flex; gap:6px; align-items:center; }
.ghost-ai .s { color:var(--accent); }
.ghost-ai:hover { background:var(--canvas); }

/* toast / switches */
#toast { position:fixed; left:50%; bottom:56px; transform:translate(-50%,16px); background:var(--ink); color:var(--card); border-radius:8px; padding:8px 14px; font-size:12px; opacity:0; pointer-events:none; transition:.18s ease; z-index:60; max-width:70vw; }
#toast.show { opacity:1; transform:translate(-50%,0); }
#switches { position:fixed; right:14px; bottom:10px; display:flex; gap:8px; align-items:center; z-index:50; }
.swnote { font-size:10px; color:var(--muted); margin-right:4px; }
.swgroup { display:flex; align-items:center; gap:0; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:2px; font-size:10.5px; color:var(--muted); }
.swgroup .swlabel { padding:0 6px 0 8px; }
.swgroup button { padding:3px 8px; border-radius:6px; font-size:10.5px; font-weight:600; color:var(--muted); }
.swgroup button.on { background:var(--sel); color:var(--ink); }

@media (max-width:1280px) { #app { grid-template-columns:56px 252px minmax(520px,1fr) 288px; } }
@media (max-width:1150px) { #app, #app.aid-closed { grid-template-columns:56px 252px minmax(480px,1fr); } #aid { display:none; } }
@media (max-width:900px) { #app, #app.aid-closed { grid-template-columns:56px minmax(0,1fr); } #context { display:none; } }
</style>

/* 温度板ミニチャート — 標準配色（体温=青 #1d4ed8 · 脈拍=赤 #d70015 · 血圧=緑 ∨∧ #5e8468、変更禁止） */
function miniVitals(temps, pulses, bps){
  const W=640, H=132, P=10, LX=30;
  const n=temps.length;
  const tx=i=>LX+P+i*(W-LX-2*P)/Math.max(1,n-1);
  const ty=v=>H-P-((v-35.5)/(39.5-35.5))*(H-2*P);
  const py=v=>H-P-((v-40)/(140-40))*(H-2*P);
  const line=(vals,fy)=>vals.map((v,i)=>`${i?'L':'M'}${tx(i).toFixed(1)},${fy(v).toFixed(1)}`).join(' ');
  const bpMarks=(bps||[]).map((bp,i)=>{
    const x=tx(i).toFixed(1), ys=py(bp[0]), yd=py(bp[1]);
    return `<line x1="${x}" x2="${x}" y1="${ys.toFixed(1)}" y2="${yd.toFixed(1)}" stroke="#5e8468" stroke-width="1.2" opacity=".8"/>
      <text x="${x}" y="${(ys+3).toFixed(1)}" font-size="9" text-anchor="middle" fill="#5e8468">∨</text>
      <text x="${x}" y="${(yd+3.5).toFixed(1)}" font-size="9" text-anchor="middle" fill="#5e8468">∧</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block" role="img" aria-label="温度板ミニチャート">
    ${[36,37,38,39].map(t=>`<line x1="${LX}" x2="${W-P}" y1="${ty(t).toFixed(1)}" y2="${ty(t).toFixed(1)}" stroke="var(--hair)"/><text x="2" y="${(ty(t)+3).toFixed(1)}" font-size="9" fill="var(--muted)">${t}℃</text>`).join('')}
    ${bpMarks}
    <path d="${line(pulses,py)}" fill="none" stroke="#d70015" stroke-width="1.5" opacity=".7"/>
    ${pulses.map((v,i)=>`<circle cx="${tx(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="2" fill="#d70015" opacity=".7"/>`).join('')}
    <path d="${line(temps,ty)}" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    ${temps.map((v,i)=>`<circle cx="${tx(i).toFixed(1)}" cy="${ty(v).toFixed(1)}" r="2.8" fill="#1d4ed8"/><text x="${tx(i).toFixed(1)}" y="${(ty(v)-7).toFixed(1)}" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1d4ed8">${v.toFixed(1)}</text>`).join('')}
  </svg>`;
}
/* 検査行の推移スパークライン（左=古い → 右=新しい） */
function spark(vs){
  const seq = vs.slice().reverse().map(([v])=>parseFloat(String(v).replace(/,/g,''))).filter(x=>!isNaN(x));
  if(seq.length<2) return '<span style="color:var(--line-strong)">·</span>';
  const min=Math.min(...seq), max=Math.max(...seq), r=(max-min)||1;
  const W=64, H=16;
  const px=i=>(2+i*(W-6)/(seq.length-1));
  const py=v=>(H-2.5-((v-min)/r)*(H-5));
  const pts=seq.map((v,i)=>`${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block; margin:0 auto">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.3" opacity=".7"/>
    <circle cx="${px(seq.length-1).toFixed(1)}" cy="${py(seq[seq.length-1]).toFixed(1)}" r="1.9" fill="var(--accent)"/></svg>`;
}
/* 基準値文字列 → 数値帯（≤/</≥/>/a–b をゆるくパース） */
function refBand(ref){
  let m;
  if(m=/([\d.]+)\s*[–-]\s*([\d.]+)/.exec(ref||'')) return {lo:+m[1], hi:+m[2]};
  if(m=/[≤<]\s*([\d.]+)/.exec(ref||'')) return {hi:+m[1]};
  if(m=/[≥>]\s*([\d.]+)/.exec(ref||'')) return {lo:+m[1]};
  return null;
}
/* 行クリックで開く 推移の詳細チャート（インライン展開 — モーダルにしない）
   スコープはドラッグではなく「名前のある期間」チップ: 全期間 / 直近1年 / この入院 */
function colDate(c){
  const [m,d] = c.d.split(' ')[0].split('/').map(Number);
  return new Date(+c.y, (m||1)-1, d||1).getTime();
}
function trendScopeKeep(c, cols, scope){
  if(scope==='1年'){
    const latest = Math.max(...cols.map(colDate));
    return colDate(c) >= latest - 366*864e5;
  }
  if(scope==='入院') return /入院|病日|退院/.test(c.tag||'');
  return true;
}
function trendChart(r, cols){
  const scope = S.trendScope||'全期間';
  const hasAdm = cols.some(c=>/入院|病日|退院/.test(c.tag||''));
  const useCols = [], useVals = [];
  cols.forEach((c,i)=>{ if(trendScopeKeep(c, cols, scope)){ useCols.push(c); useVals.push(r.v[i]); } });
  const pts = [];
  useCols.slice().reverse().forEach((c,i)=>{
    const [v,f] = useVals.slice().reverse()[i] || ['—','na'];
    const num = parseFloat(String(v).replace(/,/g,''));
    if(!isNaN(num)) pts.push({x:pts.length, label:`${c.y.slice(2)}/${c.d.split(' ')[0]}`, tag:c.tag||'', v:num, f});
  });
  const scopeChips = `<span class="tscope-row">${['全期間','1年'].concat(hasAdm?['入院']:[]).map(sc=>
    `<button class="tscope ${scope===sc?'active':''}" data-tscope="${sc}">${sc==='入院'?'この入院':sc==='1年'?'直近1年':sc}</button>`).join('')}</span>`;
  if(pts.length<2) return `<div class="trend-wrap"><div class="trend-head"><b>${r.n}</b>${scopeChips}</div><div class="lv-note">この期間には数値が2点未満です — スコープを広げてください。</div></div>`;
  const band = refBand(r.ref);
  let lo = Math.min(...pts.map(p=>p.v)), hi = Math.max(...pts.map(p=>p.v));
  if(band){ if(band.lo!=null) lo=Math.min(lo,band.lo); if(band.hi!=null) hi=Math.max(hi,band.hi); }
  const pad=(hi-lo)*0.15||1; lo-=pad; hi+=pad;
  const W=760, H=150, L=26, R=26, T=18, B=26;
  const X=i=>L+i*(W-L-R)/(pts.length-1);
  const Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const colr=f=>f==='high'?'var(--lab-high)':f==='low'?'var(--lab-low)':'var(--accent)';
  let bandSvg='';
  if(band){
    const bh=band.hi!=null?Y(band.hi):T, bl=band.lo!=null?Y(band.lo):H-B;
    bandSvg=`<rect x="${L}" y="${Math.min(bh,bl).toFixed(1)}" width="${W-L-R}" height="${Math.abs(bl-bh).toFixed(1)}" fill="#edf3ea" opacity=".85"/>
      ${band.hi!=null?`<line x1="${L}" x2="${W-R}" y1="${bh.toFixed(1)}" y2="${bh.toFixed(1)}" stroke="#9db894" stroke-dasharray="3 3"/>`:''}
      ${band.lo!=null?`<line x1="${L}" x2="${W-R}" y1="${bl.toFixed(1)}" y2="${bl.toFixed(1)}" stroke="#9db894" stroke-dasharray="3 3"/>`:''}`;
  }
  return `<div class="trend-wrap">
    <div class="trend-head"><b>${r.n}</b><span>${r.u||''}</span><span class="trend-ref">基準 ${r.ref||'—'}（緑帯）</span>${scopeChips}<span style="margin-left:auto; color:var(--muted); font-size:10.5px">${pts.length} 時点${scope==='全期間'?' — 列の表示モードに関わらず全データ':''}</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block">
      ${bandSvg}
      <polyline points="${pts.map(p=>`${X(p.x).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.8" opacity=".8"/>
      ${pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.2" fill="${colr(p.f)}"/>
        <text x="${X(p.x).toFixed(1)}" y="${(Y(p.v)-8).toFixed(1)}" font-size="10" font-weight="700" text-anchor="middle" fill="${colr(p.f)}">${p.v}</text>
        <text x="${X(p.x).toFixed(1)}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--muted)">${p.label}${p.tag?'·'+p.tag:''}</text>`).join('')}
    </svg>
  </div>`;
}

const USAGES = ['分1 朝食後','分2 朝夕食後','分3 毎食後','分1 就寝前','頓用'];
const DAYS = [7,14,28,56];
const USAGE_TIMES = {'分1 朝食後':1,'分2 朝夕食後':2,'分3 毎食後':3,'分1 就寝前':1,'頓用':null};
function compFormPane(k, i, wideBtn){
  const o = COMP_LIST[i];
  const head = (title)=>`<div class="comp-head">
    <button class="btn sm" id="comp-back">‹ 候補</button>
    <span style="font-weight:700; font-size:13px">${title}</span>

  if(o.drug){
    const d = o.drug;
    if(S.compFormFor !== d.n){
      S.compFormFor = d.n;
      const m = /^([\d.]+)([A-Za-zＴＣ]+)/.exec(d.usage) || [null,'1','T'];
      S.rxDoseN = parseFloat(m[1])||1; S.rxUnit = (m[2]||'T').toUpperCase();
      S.rxUsage = (d.usage.split('·').slice(1).join('·')||'').trim()||USAGES[0];
      S.rxDays = 28;
    }
    const checks = drugSafetyFor(k, d);
    const blocked = checks.some(c=>c.lv==='block');
    const lvClass = {block:'cf-block', warn:'cf-warnrow', ok:'cf-okrow', info:'cf-inforow'};
    const alt = checks.find(c=>c.alt);
    const dose = checks.find(c=>c.dose);
    const times = USAGE_TIMES[S.rxUsage];
    const total = times!=null ? `計 ${(S.rxDoseN*times*S.rxDays)%1?(S.rxDoseN*times*S.rxDays).toFixed(1):S.rxDoseN*times*S.rxDays}${S.rxUnit==='C'?'カプセル':'錠'}`
                              : `${S.rxDays}回分`;
    const shortName = d.n.split('「')[0].split('（')[0];
    return head('処方の内容') + `
    <div class="comp-body"><div class="rxf">
      <div class="rxf-name">${d.n}</div>
      <div class="rxf-sub">${d.cls} · ${d.sub}</div>
      <div class="rx-preview num">${shortName} ${S.rxDoseN}${S.rxUnit} · ${S.rxUsage} · ${times!=null?S.rxDays+'日分':'頓用 '+S.rxDays+'回分'}<span class="tot">${total}</span></div>
      <div class="rx-row"><span class="rx-lab">1回量</span><span class="cf-chips">${[0.5,1,2,3].map(n=>`<button class="tscope ${S.rxDoseN===n?'active':''}" data-rxn="${n}">${n}${S.rxUnit}</button>`).join('')}</span></div>
      <div class="rx-row"><span class="rx-lab">用法</span><span class="cf-chips">${USAGES.map(u=>`<button class="tscope ${S.rxUsage===u?'active':''}" data-rx-usage="${u}">${u}</button>`).join('')}</span></div>
      <div class="rx-row"><span class="rx-lab">${times!=null?'日数':'回数'}</span><span class="cf-chips">${DAYS.map(dd=>`<button class="tscope ${S.rxDays===dd?'active':''}" data-rx-days="${dd}">${dd}${times!=null?'日':'回'}</button>`).join('')}</span></div>
      ${dose?`<div class="rx-row"><span class="rx-lab">提案</span><span><button class="tscope" data-rx-suggest="${dose.dose}">腎機能に合わせる: ${dose.dose}</button></span></div>`:''}
      <div class="cf-checks">${checks.map(c=>`<div class="${lvClass[c.lv]||'cf-inforow'}">${c.lv==='block'?'⛔':c.lv==='warn'?'⚠':c.lv==='ok'?'✓':'ℹ'} ${c.t}</div>`).join('')}</div>
      <div class="cf-safe">☑ 対応病名 — あり（この患者のプロブレムと照合済み · デモ）</div>
    </div></div>
    <div class="rx-actions">
      <button class="btn primary" id="comp-add" ${blocked?'disabled':''}>${blocked?'処方できません（禁忌）':'処方して閉じる'} ${blocked?'':'<span class="kbd">⏎</span>'}</button>
      <button class="btn" id="comp-add-more" ${blocked?'disabled':''}>続けて処方</button>
      ${S.compWide?`<button class="btn" id="comp-cart-add" ${blocked?'disabled':''}>カートに追加</button>`:''}
      ${alt?`<button class="btn" id="comp-alt" data-alt-name="${alt.alt}">代替: ${alt.alt.split('（')[0]}</button>`:''}
    </div>`;
  }
  return head('オーダーの内容') + `
    <div class="comp-body"><div class="rxf">
      <div class="rxf-name">${o.n}</div>
      <div class="rxf-sub">${o.sub}${o.hint?' · '+o.hint:''}</div>
      <div class="rx-preview">${o.n}<span class="tot">${o.cat}</span></div>
      <div class="cf-checks"><div class="cf-okrow">✓ 実施条件・重複 問題なし（デモ）</div></div>
      <div class="cf-safe">☑ 対応病名 — あり · 追加は不要</div>
    </div></div>
    <div class="rx-actions">
      <button class="btn primary" id="comp-add">追加して閉じる <span class="kbd">⏎</span></button>
      <button class="btn" id="comp-add-more">続けて追加</button>
    </div>`;
}
function addOrder(k, i, close){
  const o=COMP_LIST[i], p=PATIENTS[k];
  if(!o) return;
  if(o.drug && drugSafetyFor(k,o.drug).some(c=>c.lv==='block')){ toast('禁忌のため処方できません — 代替候補を検討してください'); return; }
  if(!p.today.written){
    toast('本日の記載がまだありません — 記載を始めると行為列に着地します（モックの制約）');
    return;
  }
  const times = USAGE_TIMES[S.rxUsage];
  const a2 = o.drug ? `${S.rxDoseN}${S.rxUnit} · ${S.rxUsage} · ${times!=null?S.rxDays+'日分':S.rxDays+'回分'} — いま追加 · 未送信`
                    : `${o.sub} — いま追加 · 未送信`;
  (p.today.acts = p.today.acts || []).push({a1:o.n, a2, wait:true});
  if(close){ S.composer=false; S.compView='list'; }
  else { S.compView='list'; S.compSelIdx=null; S.compFormFor=null; }
  renderKarte(k);
  toast(`「${o.n}」を${o.drug?'処方':'行為列'}に追加しました — 概算点数は再計算（発行は確定操作で）`);
}

function gutterOf(b){
  const kinds = {visit:'診察', lab:'検査', image:'画像', adm:'入院', vitals:'温度板'};
  let gd = b.gd || '', gy = b.gy || '', gk = b.type==='event' ? (b.kind||'') : (kinds[b.type]||'');
  if(!gd){
    const m = /^(\d{4}) (\d+\/\d+)（(.)）$/.exec(b.date||'');
    if(m){ gd = m[2]; gy = `${m[1]} · ${m[3]}`; }
    else if(/^本日/.test(b.date||'')){ gd = '本日'; gy = (b.date||'').replace('本日','').trim(); }
    else { gd = b.date || ''; }
  }
  return `<div class="gut"><span class="gd num">${gd}</span>${gy?`<span class="gy num">${gy}</span>`:''}${gk?`<span class="gk">${gk}</span>`:''}</div>`;
}

  return `<div class="gut"><span class="gd num">7/14</span><span class="gy">${sub}</span><span class="gk">本日</span></div>`;
}

/* ================= karte: lens views ================= */
function matrixView(p){
  if(!p.labSeries) return `<div class="lensview"><div class="lv-head"><span class="lv-title">検査 — 表ビュー</span></div><div class="lv-note">この患者の検査データはまだありません。</div></div>`;
  const s=p.labSeries;
  return `<div class="lensview">
    <div class="lv-head"><span class="lv-title">検査 — 表ビュー（基本）</span>
      <span class="lv-sub">行=項目 × 列=時系列（左→右 = 古→新 · <b>右端が最新</b>）· <b>行クリックで推移を展開</b></span>
      <div class="lv-nav">${s.cols.length>6?`<button class="chip" id="lab-cols">列: ${S.labCols==='主要'?'主要 ✓':'すべて ✓'}</button>`:''}<button class="chip" id="lab-star">${S.labStarOnly?'★のみ ✓':'★のみ'}</button><button class="chip" data-toast="さらに過去の列を読み込み（モック）">‹ 前の期間</button><button class="chip" data-toast="選択した項目を本日の O 欄へスナップショットチップで差込 — Write 中のみ有効（React 実装対象）">選択 → O欄へ差込</button></div>
    </div>
    ${(()=>{
      const useAll = S.labCols!=='主要' || s.cols.length<=6 || !s.cols.some(c=>c.key);
      const idx = s.cols.map((c,i)=>useAll||c.key?i:null).filter(i=>i!=null);
      const cols = idx.map(i=>s.cols[i]);
      return `<div class="matrix-wrap"><table class="matrix">
      <thead><tr><th style="text-align:left">項目</th><th class="refcol">基準値</th><th class="sparkhead">推移</th>${cols.slice().reverse().map(c=>`<th><span class="yy">${c.y}</span>${c.d}${c.tag?`<span class="ctag">${c.tag}</span>`:''}</th>`).join('')}</tr></thead>
      <tbody>${s.groups.map(g=>{
        const rows=g.rows.filter(r=>!S.labStarOnly || r.n.includes('★'));
        if(!rows.length) return '';
        return `<tr class="gr"><th colspan="${3+cols.length}">${g.g}</th></tr>`+
        rows.map(r=>{
          const cells = idx.map(i=>r.v[i]).slice().reverse();
          const open = S.trendOpen[r.n];

          (open?`<tr class="trendrow"><td colspan="${3+cols.length}">${trendChart(r, s.cols)}</td></tr>`:'');
        }).join('');
      }).join('')}</tbody>
    </table></div>`;
    })()}

/* ================= karte: calendar index ================= */
function buildCalIndex(p){
  const entries = [{ym:'2026-07', anchor:'blk-today'}];
  (p.blocks||[]).forEach((b,i)=>{
    if(b.type==='yearfold'){
      /* まとめ年も月単位でインデックス化 — クリック時に自動展開する */
      (b.blocks||[]).forEach((x,j)=>entries.push({ym:x.ym, anchor:`blk-${i}-${j}`, expandYear:b.year}));
    } else {
      entries.push({ym:b.ym, anchor:`blk-${i}`});
    }
  });
  const years = {};
  entries.forEach(e=>{
    const [y,m]=e.ym.split('-');
    years[y] = years[y] || [];
    if(!years[y].some(x=>x.m===+m)) years[y].push({m:+m, anchor:e.anchor, expandYear:e.expandYear});
  });
  return Object.entries(years).sort((a,b)=>b[0]-a[0]);
}
function calPopover(p){
  if(!S.calOpen) return '';
  const years = buildCalIndex(p);
  return `<div id="calpop">
    <div class="cp-head">カレンダー — 受診月へジャンプ<button class="x" id="cal-close">✕</button></div>
    ${years.map(([y,ms])=>`<div class="cp-year"><span class="cp-y num">${y}</span>
      <span class="cp-months">${ms.sort((a,b)=>b.m-a.m).map(m=>`
        <button class="cp-m ${m.expandYear?'fold':''}" data-anchor="${m.anchor}" ${m.expandYear?`data-expand-year="${m.expandYear}"`:''}>${m.m}月</button>`).join('')}</span></div>`).join('')}
    <div class="cp-note">月をクリックでその位置へ。グレーの月は年ダイジェスト内 — 自動で展開してからジャンプします。</div>
  </div>`;
}

      main.querySelectorAll('[data-rx-usage]').forEach(b=>b.onclick=()=>{S.rxUsage=b.dataset.rxUsage; renderKarte(k);});
      main.querySelectorAll('[data-rx-days]').forEach(b=>b.onclick=()=>{S.rxDays=+b.dataset.rxDays; renderKarte(k);});

      };

        const nm=ab.dataset.altName||'';
        const idx=COMP_LIST.findIndex(x=>x.drug && nm.includes(x.drug.n.split('錠')[0].split('カプセル')[0]));
        if(idx>=0){ S.compSelIdx=idx; S.compFormFor=null; renderKarte(k); toast('代替候補に切り替えました'); }
      };
      const ad=$('#comp-add'); if(ad && !ad.disabled) ad.onclick=()=>addOrder(k, S.compSelIdx, true);
      const am=$('#comp-add-more'); if(am && !am.disabled) am.onclick=()=>addOrder(k, S.compSelIdx, false);
    } else {
      const rows=[...main.querySelectorAll('.comp-row')].filter(r=>!r.closest('.comp-side'));
      rows.forEach(r=>r.onclick=()=>{S.compSelIdx=+r.dataset.i; S.compView='form'; S.compFormFor=null; renderKarte(k);});
      const q=$('#comp-q');
      if(q){
        q.focus();
        q.oninput=()=>{const v=q.value.trim(); rows.forEach(r=>{r.style.display=(!v||r.dataset.txt.includes(v))?'':'none';});};
        q.addEventListener('keydown',(ev)=>{
          if(ev.key==='Enter'){ const first=rows.find(r=>r.style.display!=='none'); if(first) first.click(); }
          if(ev.key==='Escape'){ S.composer=false; S.compView='list'; renderKarte(k); }
          ev.stopPropagation();
        });
      }
      const ccl=$('#comp-cat-clear'); if(ccl) ccl.onclick=()=>{S.compCat=null; renderKarte(k);};
    }
  }
  main.querySelectorAll('[data-new-rx]').forEach(b=>b.onclick=()=>{S.composer=true; S.compCat='処方'; S.compSelIdx=null; S.report=null; renderKarte(k);});
  main.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{S.report=b.dataset.report; S.composer=false; renderKarte(k);});
  const rc=$('#rep-close'); if(rc) rc.onclick=()=>{S.report=null; renderKarte(k);};
  main.querySelectorAll('[data-do-med]').forEach(b=>b.onclick=()=>{
    const p=PATIENTS[k], m=(p.activeMeds||[])[+b.dataset.doMed];
    if(!m) return;
    if(!p.today.written){ toast('本日の記載がまだありません — 記載を始めると Do が行為列に着地します'); return; }
    (p.today.acts=p.today.acts||[]).push({a1:m.n, a2:`${m.u} · 28日分 — 前回 Do · 未送信`, wait:true});
    renderKarte(k); toast(`「${m.n}」を前回 Do — PMDA チェック済み（変更なしのため差分なし）`);
  });
  main.querySelectorAll('[data-do-all]').forEach(b=>b.onclick=()=>{
    const p=PATIENTS[k];
    if(!p.today.written){ toast('本日の記載がまだありません — 記載を始めると Do が行為列に着地します'); return; }
    (p.activeMeds||[]).forEach(m=>(p.today.acts=p.today.acts||[]).push({a1:m.n, a2:`${m.u} · 28日分 — 前回 Do · 未送信`, wait:true}));
    renderKarte(k); toast(`${(p.activeMeds||[]).length}剤を前回 Do しました — 行為列に着地（未送信）`);
  });
  /* month float */
  const mf=$('#month-float');
  if(mf){
    const content=$('#content');
    content.onscroll=()=>{
      const blocks=[...content.querySelectorAll('[data-ym]')];
      let label='2026-07';
      for(const b of blocks){ if(b.offsetTop <= content.scrollTop+150) label=b.dataset.ym; }
      const [y,m]=label.split('-');
      mf.textContent=`${y}年${+m}月`;
    };
  }
  bindCommon();
}

/* write flow */
function startWrite(k){
  const p=PATIENTS[k];
  if(S.role!=='doctor'){ toast('診療記載は医師ロールのみ — 看護は看護記録、医事は閲覧'); return; }
  if(p.today.written){ toast('本日の記載は確定済みです（追記は ／ から）'); return; }
  if(!p.today.draft){ toast('このモックでは 鈴木 花子 で記載フローを試せます'); return; }
  S.writing=true; S.lens='すべて'; renderKarte(k);
  toast('本日の記載を開始 — 画面遷移せず、その場で書きます');
}
function finishWrite(k){
  const p=PATIENTS[k];
  Object.assign(p.today, p.today.draft, {written:true});
  p.save=`保存済み ${p.today.ver} · ${p.today.at}`;
  S.writing=false;
  p.stateText='診察中'; p.stateKind='accent';
  renderAll();
  toast('書き終えました — 版を確定（v1）。O 欄の検査値は @差込チップです');
}
function endVisit(k){
  const p=PATIENTS[k];
  if(p.inpatient){ toast('入院中は「診察を終了」ではなく退院処理で完了します — 回診記録は書き終えるだけでOK'); return; }
  p.status='done'; p.stateText='診察終了 · 会計待ち'; p.stateKind='done';
  const next = ORDER.map(x=>PATIENTS[x]).filter(x=>x.status!=='done' && x!==p)
    .sort((a,b)=>a.time<b.time?-1:1)[0];
  if(next){
    const nk = Object.keys(PATIENTS).find(x=>PATIENTS[x]===next);
    openPatient(nk);
    toast(`${p.name} の診察を終了 — 次: ${next.name}（${next.stateText}）`);
  } else {
    S.patient=null; renderAll(); toast(`${p.name} の診察を終了 — 本日の外来は全員終了です`);
  }
}

function syncAid(){ app.classList.toggle('aid-closed', !S.aidOpen); }

/* ================= orchestration ================= */
function renderMain(){
  if(S.ws==='outpatient'){ S.patient ? renderKarte(S.patient) : renderHome(); }
  else if(S.ws==='ward'){
    /* 外来と同じフロー: キューの患者を直接カルテで開く（中間画面なし） */
    const pool=wardPool(); if(!pool.some(b=>b.key===S.wardBed)) S.wardBed=pool[0].key;
    renderKarte(S.wardBed);
  }
  else if(S.ws==='billing') renderBilling();
  else if(S.ws==='lab') renderLabWs();
  else if(S.ws==='messages') renderMessages();
  else renderSettings();
}
function renderAll(){ renderRail(); renderContext(); renderMain(); renderAid(); syncAid(); }
function switchWs(ws){
  if(S.ws===ws && ws==='outpatient'){ S.patient=null; }
  S.ws=ws; S.writing=false; S.calOpen=false;
  if(ws==='messages'){ S.msgUnread=0; }
  renderAll();
}
function openPatient(k){
  S.ws='outpatient'; S.patient=k; S.writing=false; S.aiOpen=false; S.lens='すべて'; S.calOpen=false;
  S.composer=false; S.trendOpen={}; S.orderCat='すべて'; S.compCat=null; S.compFormFor=null; S.compView='list'; S.report=null;
  renderAll();
}

/* keyboard */
document.addEventListener('keydown',(e)=>{
  const activeK = S.ws==='outpatient' ? S.patient : (S.ws==='ward' ? S.wardBed : null);
  const inField = e.target && /INPUT|TEXTAREA/.test(e.target.tagName);
  if((e.metaKey||e.ctrlKey) && (e.key==='o'||e.key==='O')){
    if(activeK){ e.preventDefault(); S.composer=!S.composer; S.compSelIdx=null; renderKarte(activeK); }
    return;
  }
  if((e.metaKey||e.ctrlKey) && (e.key==='l'||e.key==='L')){
    if(activeK){ e.preventDefault(); S.composer=false; S.lens='検査'; renderKarte(activeK); }
    return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(inField) return;
  if(S.composer && ['1','2','3'].includes(e.key) && activeK){
    const r=[...main.querySelectorAll('.comp-row')].filter(x=>!x.closest('.comp-side'))[+e.key-1];
    if(r){ r.click(); } return;
  }
  if(e.key==='Escape' && S.composer){ S.composer=false; if(activeK) renderKarte(activeK); return; }
  if(S.ws!=='outpatient' && S.ws!=='ward') return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(S.ws==='outpatient'){
      const i = S.patient?ORDER.indexOf(S.patient):-1;
      const ni = e.key==='ArrowDown' ? Math.min(ORDER.length-1,i+1) : Math.max(0,i-1);
      openPatient(ORDER[ni]);
    } else {
      const keys = wardPool().map(b=>b.key);
      const i = keys.indexOf(S.wardBed);
      S.wardBed = keys[e.key==='ArrowDown' ? Math.min(keys.length-1,i+1) : Math.max(0,i-1)];
      renderAll();
    }
  }
  if(e.key==='Escape'){ if(S.calOpen){S.calOpen=false; renderMain();} else if(S.aiOpen){ S.aiOpen=false; renderMain(); } }
  if((e.key==='e'||e.key==='E') && activeK && !S.writing){ startWrite(activeK); }
});

/* switches */
function bindSwitch(id, fn){ $(id).onclick=fn; }
bindSwitch('#sw-pal-muted',()=>{document.body.classList.add('pal-muted');document.body.classList.remove('pal-apple');
  $('#sw-pal-muted').classList.add('on');$('#sw-pal-apple').classList.remove('on');});
bindSwitch('#sw-pal-apple',()=>{document.body.classList.add('pal-apple');document.body.classList.remove('pal-muted');
  $('#sw-pal-apple').classList.add('on');$('#sw-pal-muted').classList.remove('on');});
bindSwitch('#sw-font-sans',()=>{document.body.classList.add('font-sans');document.body.classList.remove('font-mono');
  $('#sw-font-sans').classList.add('on');$('#sw-font-mono').classList.remove('on');});
bindSwitch('#sw-font-mono',()=>{document.body.classList.add('font-mono');document.body.classList.remove('font-sans');
  $('#sw-font-mono').classList.add('on');$('#sw-font-sans').classList.remove('on');});
function setRole(r){
  S.role=r;
  ['doctor','nurse','clerk','tech'].forEach(x=>$('#sw-role-'+x).classList.toggle('on', x===r));
  if(S.ws==='outpatient' && S.patient){
    S.writing=false;
    renderAll();
    toast(`職種ビュー: ${ROLES[r].label} — 同じカルテを「${r==='doctor'?'医師標準':r==='nurse'?'看護標準':'医事閲覧'}」で表示`);
  } else {
    switchWs(ROLES[r].home);
    toast(`職種ビュー: ${ROLES[r].label} — レールが ${ROLES[r].spaces.map(s=>WS_LABEL[s]).join('・')}・設定 に剪定されます`);
  }
}
bindSwitch('#sw-role-doctor',()=>setRole('doctor'));
bindSwitch('#sw-role-nurse',()=>setRole('nurse'));
bindSwitch('#sw-role-clerk',()=>setRole('clerk'));
bindSwitch('#sw-role-tech',()=>setRole('tech'));

/* ================= async result demo =================
   20秒後: 高橋の採血結果が到着 → キュー状態が変わり、連絡バッジ+1、トースト通知。
   カルテを開いて「まだ無かった」を繰り返す必要がない、の実演 */
function deliverTakahashiResult(){
  if(S.resultArrived) return;
  S.resultArrived = true;
  const p = PATIENTS.takahashi;
  p.stateText='診察可 · 結果 1/1'; p.stateKind='attention';
  p.stateDetail='採血 10:20 → 結果 12:00 ✓ — eGFR 42 ↓（前回 44）';
  p.oneLiner='#1 CKD G3b。本日の採血が到着: eGFR 42 ↓（前回 44）· Cr 1.31 ↑。診察前に推移を確認。';
  p.aiEv[2]={d:'本日 12:00', t:'検査 eGFR 42 ↓ · Cr 1.31 ↑（到着）'};
  p.blocks.unshift({type:'lab', ym:'2026-07', date:'本日 12:00', sub:'検査結果 · 院内採血（いま到着）',
    labs:[
      {n:'eGFR', v:'42', u:'mL/min/1.73m²', flag:'low', ref:'前回 44'},
      {n:'クレアチニン', v:'1.31', u:'mg/dL', flag:'high', ref:'基準 1.07 以下'},
      {n:'カリウム', v:'4.7', u:'mEq/L', ref:'基準 3.6–4.8'}
    ]});
  p.labSeries.cols.unshift({y:'2026', d:'7/14'});
  const rs = p.labSeries.groups.flatMap(g=>g.rows);
  rs[0].v.unshift(['42','low']);
  rs[1].v.unshift(['1.31','high']);
  rs[2].v.unshift(['4.7','']);
  p.orderTimeline[0]={cat:'検査', d:'本日 10:20 → 12:00', w:'採血（腎機能 · 電解質）', sub:'院内検査室', st:'結果到着', k:'done'};
  S.msgUnread += 1;
  renderRail(); if(S.ws==='outpatient'){ renderContext(); if(S.patient==='takahashi') renderMain(); renderAid(); }
  toast('🔔 高橋 一郎 — 結果が揃い「診察可」に昇格（eGFR 42 ↓）。通知はこの昇格とパニック値だけです');
}
setTimeout(deliverTakahashiResult, 20000);

/* boot */
openPatient('sato');
</script>
