[project]
name = "manta-backend"
version = "0.1.0"
description = "FastAPI backend for Manta outpatient EMR MVP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.16.5,<2.0.0",
  "argon2-cffi>=23.1.0,<24.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "fhir.resources>=8.0.0,<9.0.0",
  "httpx>=0.28.1,<1.0.0",
  "PyJWT>=2.10.1,<3.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "psycopg[binary]>=3.2.10,<4.0.0",
  "sqlalchemy>=2.0.43,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
  "import-linter>=2.0,<3.0",
  "pytest>=8.4.2,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Module layers"
type = "layers"
layers = [
  "app.modules.admin",
  "app.modules.gateway",
  "app.modules.rececon",
  "app.modules.inpatient",
  "app.modules.karte : app.modules.master_data",
  "app.modules.auth",
  "app.modules.common",
]

[[tool.importlinter.contracts]]
name = "Modules do not import from main"
type = "forbidden"
source_modules = [
  "app.modules.admin",
  "app.modules.auth",
  "app.modules.common",
  "app.modules.gateway",
  "app.modules.inpatient",
  "app.modules.karte",
  "app.modules.master_data",
  "app.modules.rececon",
]
forbidden_modules = [
  "app.main",
]
