services:
  db:
    image: postgres:16-alpine
    container_name: manta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: manta
      POSTGRES_USER: manta
      POSTGRES_PASSWORD: manta
    ports:
      - "5432:5432"
    volumes:
      - manta-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manta -d manta"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: manta-api
    restart: unless-stopped
    environment:
      MANTA_DATABASE_URL: postgresql+psycopg://manta:manta@db:5432/manta
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: manta-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "4173:4173"

volumes:
  manta-postgres-data:
